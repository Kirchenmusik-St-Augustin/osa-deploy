---
# Day-2 operations: keeps secrets, Quadlet definitions, the Caddyfile, and
# timers in sync on the production host, and keeps the whole stack (Caddy +
# Backend + Frontend + Dozzle) plus the weekly podman-prune timer running.
# Builds NO images, clones NO app repos -- the images already come
# pre-built from ghcr.io and are pulled in automatically by the already-
# active podman-auto-update.timer.
#
# Usage: ansible-playbook -i inventory/<stage>.ini playbooks/deploy.yml --ask-vault-pass --check --diff
#        ansible-playbook -i inventory/<stage>.ini playbooks/deploy.yml --ask-vault-pass
# <stage> is one of the files in inventory/ (production/test/qa).
#
# Immediate deploy instead of waiting for the nightly auto-update run:
#   ansible-playbook -i inventory/<stage>.ini ... --ask-vault-pass --tags deploy-backend
#   ansible-playbook -i inventory/<stage>.ini ... --ask-vault-pass --tags deploy-frontend

- name: Deploy and sync the OSA stack on the selected stage
  hosts: vps
  remote_user: service
  gather_facts: yes
  # Explicit vars_files instead of inventory/group_vars/: an
  # automatically-loaded group variable applies to EVERY play that
  # targets this host -- including setup_vps.yml (hosts: all), which
  # never references koofr_user/koofr_password at all. vars_files scopes
  # the file to this one play instead, so only a deploy.yml run needs a
  # vault password for it. Production receives the account that writes and
  # prunes the backups; every other stage receives a second, read-only
  # account (non-production stages only download the latest production
  # backup), so a lower-trust host never holds a credential that can
  # overwrite or delete them.
  vars_files:
    - "../secrets/{{ 'production' if app_environment == 'production' else 'nonproduction' }}/koofr.yml"
  vars:
    local_secrets_path: "../secrets/{{ app_environment }}"
    local_quadlets_path: "../quadlets"
    local_templates_path: "../templates"
    local_timers_path: "../systemd-timers"
    local_caddyfile_path: "../config/caddy/Caddyfile.j2"
    local_app_role_sql_file: "../config/postgres/split-app-role.sql"
    # The pinned Caddy image, read from the Quadlet so the Caddyfile is
    # validated with exactly the version that will run it.
    caddy_image: "{{ lookup('ansible.builtin.file', local_quadlets_path ~ '/caddy/caddy.container') | regex_search('^Image=(\\S+)', '\\1', multiline=True) | first }}"

    remote_env_dir: "{{ ansible_user_dir }}/.env"
    remote_quadlet_base: "{{ ansible_user_dir }}/.config/containers/systemd"
    remote_systemd_user_dir: "{{ ansible_user_dir }}/.config/systemd/user"
    xdg_runtime_dir: "/run/user/{{ ansible_facts.user_uid }}"
    registry_prefix: ghcr.io/kirchenmusik-st-augustin

    # Quadlet source folder -> destination path under remote_quadlet_base.
    quadlet_targets:
      - { src: caddy, dest: "osa/infrastructure/caddy" }
      - { src: logging, dest: "osa/infrastructure/logging" }
      - { src: backend, dest: "osa/osa-backend" }
      - { src: frontend, dest: "osa/osa-frontend" }

    # The complete stack -- a single set of units.
    managed_units_safe:
      - podman-prune.timer
      - caddy.service
      - osa-backend-pod.service
      - osa-frontend-pod.service
      - logging-dozzle.service

  tasks:
    # "development" is deliberately NOT in this list: local development
    # runs via the Vite dev server directly on the dev machine, never
    # through this Ansible flow -- even though it is one of the four valid
    # APP_ENVIRONMENT values in the backend itself (see
    # osa-backend/app/core/config.py's _VALID_ENVIRONMENTS).
    - name: Validate app_environment against the valid deploy stages
      tags: [always]
      ansible.builtin.assert:
        that:
          - "app_environment in ['test', 'qa', 'production']"
        fail_msg: >-
          app_environment='{{ app_environment }}' is invalid. It must be one of
          test/qa/production ("development" is never rolled out through
          osa-deploy).

    - name: Refuse placeholder or malformed inventory values
      tags: [always]
      ansible.builtin.assert:
        that:
          - item is regex('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
          - not (item is search('(^|\\.)(invalid|example)(\\.|$)|changeme', ignorecase=True))
        fail_msg: "'{{ item }}' is not a usable public hostname (placeholder or malformed)."
        quiet: true
      loop:
        - "{{ backend_domain }}"
        - "{{ frontend_domain }}"
        - "{{ shorturl_domain }}"

    # A vars_files entry whose file does not exist is skipped without any
    # message, so a missing or empty Koofr file would otherwise surface as an
    # undefined variable inside a no_log template task.
    - name: Require the Koofr credentials of this stage
      tags: [always]
      ansible.builtin.assert:
        that:
          - koofr_user is defined
          - koofr_password is defined
        fail_msg: >-
          koofr_user/koofr_password are not defined. Create
          secrets/{{ 'production' if app_environment == 'production' else 'nonproduction' }}/koofr.yml
          from its .example file and encrypt it with ansible-vault.

    - name: Create the directory structure
      tags: [always]
      loop:
        - "{{ remote_env_dir }}"
        - "{{ remote_quadlet_base }}"
        - "{{ remote_systemd_user_dir }}"
        - "{{ ansible_user_dir }}/data/osa/{{ app_environment }}/postgres"
        - "{{ ansible_user_dir }}/data/osa/{{ app_environment }}/valkey"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"

    # Rootless-Podman UID mapping: a freshly created directory belongs to
    # the calling user's own UID in the default namespace, but the
    # official postgres image's entrypoint runs as UID 999 inside its own
    # namespace - without this fix, initdb fails on the very first start
    # with a permission error. Both commands must run under
    # "podman unshare", not a plain chown/chmod - afterwards the directory
    # belongs to the mapped UID, and the calling user itself can no longer
    # read it directly from outside a "podman unshare" shell. The recursive
    # change only runs when the top-level directory differs from the wanted
    # state (a fresh directory), so a deploy never walks the live database.
    # Under --check the directory may not exist yet, hence the lenient
    # failure condition.
    - name: Read the PostgreSQL data directory owner and mode as seen inside the user namespace
      tags: [always]
      ansible.builtin.command: >-
        podman unshare stat -c '%u:%g:%a'
        {{ ansible_user_dir }}/data/osa/{{ app_environment }}/postgres
      register: pg_dir_state
      changed_when: false
      check_mode: false
      failed_when: pg_dir_state.rc != 0 and not ansible_check_mode

    - name: Fix PostgreSQL data directory ownership and mode (rootless UID mapping)
      tags: [always]
      when: pg_dir_state.stdout | trim != '999:999:700'
      ansible.builtin.command: >-
        podman unshare sh -c 'chown -R 999:999 "$0" && chmod 700 "$0"'
        {{ ansible_user_dir }}/data/osa/{{ app_environment }}/postgres

    - name: "Find static *.env files in secrets/{{ app_environment }}/"
      tags: [always]
      delegate_to: localhost
      become: no
      ansible.builtin.find:
        paths: "{{ local_secrets_path }}"
        patterns: "*.env"
      register: secret_files

    - name: "Find templated *.env.j2 files in secrets/{{ app_environment }}/"
      tags: [always]
      delegate_to: localhost
      become: no
      ansible.builtin.find:
        paths: "{{ local_secrets_path }}"
        patterns: "*.env.j2"
      register: secret_templates

    - name: Refuse to deploy secret files that are not vault-encrypted
      tags: [always]
      delegate_to: localhost
      become: no
      run_once: true
      check_mode: false
      changed_when: false
      ansible.builtin.shell: >-
        grep -L '^\$ANSIBLE_VAULT;'
        {{ (secret_files.files + secret_templates.files) | map(attribute='path') | map('quote') | join(' ') }}
        {{ ('../secrets/' ~ ('production' if app_environment == 'production' else 'nonproduction') ~ '/koofr.yml') | quote }}
        || true
      register: unencrypted_secret_files
      failed_when: unencrypted_secret_files.stdout | trim | length > 0

    # Orphaned secret files keep stale credentials alive. Deleting files on a
    # live host automatically is itself risky, so the run stops and lists the
    # names for a manual, reviewed removal.
    - name: List the files currently in ~/.env
      tags: [always]
      ansible.builtin.find:
        paths: "{{ remote_env_dir }}"
        file_type: file
      register: env_dir_files

    - name: Fail on secret files that this playbook does not manage
      tags: [always]
      vars:
        managed_env_files: >-
          {{ (secret_files.files + secret_templates.files)
             | map(attribute='path') | map('basename')
             | map('regex_replace', '[.]j2$', '') | list }}
        unmanaged_env_files: >-
          {{ env_dir_files.files | map(attribute='path') | map('basename')
             | difference(managed_env_files) | list }}
      ansible.builtin.assert:
        that: unmanaged_env_files | length == 0
        fail_msg: >-
          Unmanaged files in {{ remote_env_dir }}: {{ unmanaged_env_files | join(', ') }}.
          Review and delete them by hand.
        quiet: true

    - name: Copy static secrets to ~/.env
      tags: [always]
      no_log: true
      loop: "{{ secret_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ remote_env_dir }}/{{ item.path | basename }}"
        mode: "0600"
      register: static_secret_copy

    - name: Render templated secrets and copy them to ~/.env
      tags: [always]
      no_log: true
      loop: "{{ secret_templates.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      ansible.builtin.template:
        src: "{{ item.path }}"
        dest: "{{ remote_env_dir }}/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        mode: "0600"
      register: templated_secret_copy

    # The environment files are read when a container starts, so a changed
    # secret only reaches the running process through a restart of its
    # consumer. The restart tasks below match these names.
    - name: Collect the names of the secret files that changed
      tags: [always]
      ansible.builtin.set_fact:
        changed_secret_files: >-
          {{ (static_secret_copy.results + templated_secret_copy.results)
             | selectattr('changed')
             | map(attribute='item.path')
             | map('basename')
             | map('regex_replace', '[.]j2$', '')
             | list }}

    - name: Create the Quadlet directories
      tags: [always]
      loop: "{{ quadlet_targets }}"
      loop_control:
        label: "{{ item.dest }}"
      ansible.builtin.file:
        path: "{{ remote_quadlet_base }}/{{ item.dest }}"
        state: directory
        mode: "0755"

    # Caddy is excluded from this list (its own task right below, with its
    # own register) -- the restart trigger further down must also react to
    # changes in the quadlet definition itself, not only to changes in the
    # Caddyfile.
    - name: Copy the Quadlet files
      tags: [always]
      loop: "{{ quadlet_targets | rejectattr('src', 'equalto', 'caddy') | list }}"
      loop_control:
        label: "{{ item.dest }}"
      ansible.builtin.copy:
        src: "{{ local_quadlets_path }}/{{ item.src }}/"
        dest: "{{ remote_quadlet_base }}/{{ item.dest }}/"
        mode: "0644"
      register: quadlet_copy_results

    # Kept separate from the generic copy above so a change to the quadlet
    # definition itself (e.g. its volume mount) triggers the same Caddy
    # restart as a change to the Caddyfile.
    - name: Copy the Caddy Quadlet files
      tags: [always]
      ansible.builtin.copy:
        src: "{{ local_quadlets_path }}/caddy/"
        dest: "{{ remote_quadlet_base }}/osa/infrastructure/caddy/"
        mode: "0644"
      register: caddy_quadlet_copy

    # Both Quadlets have stage-dependent content (data path) -- kept
    # separate from the generic directory copy above since they must be
    # rendered rather than just copied.
    - name: "Render the PostgreSQL Quadlet (volume path depends on the stage)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/osa-backend-pg.container.j2"
        dest: "{{ remote_quadlet_base }}/osa/osa-backend/osa-backend-pg.container"
        mode: "0644"
      register: pg_quadlet_render

    - name: "Render the Valkey Quadlet (volume path depends on the stage)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/osa-backend-valkey.container.j2"
        dest: "{{ remote_quadlet_base }}/osa/osa-backend/osa-backend-valkey.container"
        mode: "0644"
      register: valkey_quadlet_render

    # The three application Quadlets carry the image tag (osa_*_image_tag,
    # default "latest"), so they are rendered like the Quadlets above.
    - name: "Render the backend Quadlet (image tag can be pinned per stage)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/osa-backend.container.j2"
        dest: "{{ remote_quadlet_base }}/osa/osa-backend/osa-backend.container"
        mode: "0644"
      register: backend_quadlet_render

    - name: "Render the worker Quadlet (same image tag as the backend)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/osa-backend-worker.container.j2"
        dest: "{{ remote_quadlet_base }}/osa/osa-backend/osa-backend-worker.container"
        mode: "0644"
      register: worker_quadlet_render

    - name: "Render the frontend Quadlet (image tag can be pinned per stage)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/osa-frontend.container.j2"
        dest: "{{ remote_quadlet_base }}/osa/osa-frontend/osa-frontend.container"
        mode: "0644"
      register: frontend_quadlet_render

    # caddy.container's volume mount expects the Caddyfile directly next
    # to the Quadlet definition, see quadlets/caddy/caddy.container.
    - name: Render the Caddyfile (validated with the pinned Caddy image before it replaces the live one)
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_caddyfile_path }}"
        dest: "{{ remote_quadlet_base }}/osa/infrastructure/caddy/Caddyfile"
        mode: "0644"
        # A syntax error would otherwise replace the live file and take the
        # only public ingress down at the restart that follows.
        validate: >-
          podman run --rm -e LOGGING_USER=validate -e LOGGING_PASSWORD_HASH=validate
          -v %s:/etc/caddy/Caddyfile:ro,z {{ caddy_image }}
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      register: caddyfile_copy

    # Both volume Quadlets carry the stage name in VolumeName= (instead of
    # a hardcoded "-prod"), hence rendered rather than just copied --
    # otherwise the identical file would also land on test/qa and wrongly
    # name their volumes "prod".
    - name: "Render the Caddy data volume Quadlet (volume name depends on the stage)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/caddy-data.volume.j2"
        dest: "{{ remote_quadlet_base }}/osa/infrastructure/caddy/caddy-data.volume"
        mode: "0644"
      register: caddy_data_volume_render

    - name: "Render the Caddy config volume Quadlet (volume name depends on the stage)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/caddy-config.volume.j2"
        dest: "{{ remote_quadlet_base }}/osa/infrastructure/caddy/caddy-config.volume"
        mode: "0644"
      register: caddy_config_volume_render

    - name: Copy the native systemd units (podman-prune service and timer; not Quadlets, separate target path)
      tags: [always]
      ansible.builtin.copy:
        src: "{{ local_timers_path }}/"
        dest: "{{ remote_systemd_user_dir }}/"
        mode: "0644"

    - name: systemctl --user daemon-reload
      tags: [always]
      ansible.builtin.systemd:
        scope: user
        daemon_reload: yes
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Enable and start the stack services and timers
      tags: [always]
      loop: "{{ managed_units_safe }}"
      ansible.builtin.systemd:
        scope: user
        name: "{{ item }}"
        enabled: yes
        state: started
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      # A stage's very first deploy: --check never actually writes the
      # Quadlet files above, so systemd-generator never produces these
      # units at all yet -- querying their current state genuinely fails,
      # not just "would change". ignore_errors here only ever applies
      # under --check (a real apply still fails hard on a real problem);
      # on an already-deployed host the units exist and this task
      # succeeds normally, so this never hides a real diff there.
      ignore_errors: "{{ ansible_check_mode }}"

    # ------------------------------------------------------------------
    # Application database role. The backend connects as "osa_app", a
    # non-superuser that owns the database, never as the bootstrap role of
    # osa-backend-pg.env. The script is idempotent, so it runs on every
    # deploy: on a fresh stage it creates the role before the pod restart
    # below (otherwise the backend cannot log in), on an existing database it
    # changes nothing, and a rotated password in DATABASE_URL is applied to
    # the role as well. The password is read from the local secret file, so
    # --check validates it too.
    # ------------------------------------------------------------------
    - name: Read the application role password from DATABASE_URL
      tags: [always]
      no_log: true
      ansible.builtin.set_fact:
        osa_app_password: >-
          {{ lookup('ansible.builtin.file', local_secrets_path ~ '/osa-backend.env.j2')
             | regex_findall('^DATABASE_URL=[^:]+://osa_app:([^@]*)@', multiline=True)
             | first | default('') }}

    # The password goes into the URL as it is, so only characters that need no
    # URL escaping are accepted: the value in the URL is then also the value
    # the role must have. The value is checked inside a no_log fact and only
    # the resulting boolean is asserted, so the failure message stays visible.
    - name: Check that the application role password can be used unescaped
      tags: [always]
      no_log: true
      ansible.builtin.set_fact:
        osa_app_password_valid: "{{ osa_app_password is match('^[A-Za-z0-9._~-]{16,}$') }}"

    - name: Ensure DATABASE_URL names osa_app with a usable password
      tags: [always]
      ansible.builtin.assert:
        that:
          - osa_app_password_valid
        fail_msg: >-
          DATABASE_URL in secrets/{{ app_environment }}/osa-backend.env.j2
          must use the user osa_app with a password of at least 16
          characters from A-Z, a-z, 0-9 and . _ ~ - (no URL escaping).

    - name: Create or update the application database role and its ownership
      tags: [always]
      no_log: true
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -i
          - -e
          - OSA_APP_PASSWORD
          - osa-backend-pg
          - sh
          - -c
          - exec psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -v ON_ERROR_STOP=1
        stdin: "{{ lookup('ansible.builtin.file', local_app_role_sql_file) }}"
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
        OSA_APP_PASSWORD: "{{ osa_app_password }}"
      register: app_role_result
      # The first start of PostgreSQL creates the data directory, which takes
      # a while on a small server; the role can only be created once the
      # database accepts connections. Three minutes cover slow disks too.
      retries: 60
      delay: 3
      until: app_role_result.rc == 0
      # The script only converges to the wanted state, so a run that changes
      # nothing must not be reported as a change.
      changed_when: false

    - name: Restart Caddy if the Caddyfile, the Quadlet or its secrets changed
      tags: [always]
      when: >-
        caddyfile_copy.changed or caddy_quadlet_copy.changed
        or caddy_data_volume_render.changed or caddy_config_volume_render.changed
        or 'caddy.env' in changed_secret_files
      ansible.builtin.systemd:
        scope: user
        name: caddy.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      # Same first-deploy reasoning as the task above -- caddy.service
      # doesn't exist yet either on a --check run against a brand-new host.
      ignore_errors: "{{ ansible_check_mode }}"

    # osa-backend-pod covers backend+worker: both containers are members of
    # the same pod (osa-backend.pod's own Wants=/Before= already restarts
    # the worker alongside it, see that file), and both Quadlets are
    # rendered into the same "osa/osa-backend" directory. Without this task,
    # a quadlet-only change (e.g. a hardening flag or a new image tag) would
    # sit on disk without ever reaching the running container.
    - name: Restart osa-backend-pod if the backend, worker, PostgreSQL or Valkey Quadlet or their secrets changed
      tags: [always]
      when: >-
        (quadlet_copy_results.results
          | selectattr('item.dest', 'equalto', 'osa/osa-backend')
          | selectattr('changed')
          | list | length > 0)
        or pg_quadlet_render.changed
        or valkey_quadlet_render.changed
        or backend_quadlet_render.changed
        or worker_quadlet_render.changed
        or (changed_secret_files
          | intersect(['osa-backend.env', 'osa-backend-pg.env', 'osa-backend-valkey.env'])
          | length > 0)
      ansible.builtin.systemd:
        scope: user
        name: osa-backend-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Restart osa-frontend-pod if the frontend Quadlet or its secrets changed
      tags: [always]
      when: >-
        quadlet_copy_results.results
          | selectattr('item.dest', 'equalto', 'osa/osa-frontend')
          | selectattr('changed')
          | list | length > 0
        or frontend_quadlet_render.changed
        or 'osa-frontend.env' in changed_secret_files
      ansible.builtin.systemd:
        scope: user
        name: osa-frontend-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Restart logging-dozzle if its Quadlet changed
      tags: [always]
      when: >-
        quadlet_copy_results.results
          | selectattr('item.dest', 'equalto', 'osa/infrastructure/logging')
          | selectattr('changed')
          | list | length > 0
      ansible.builtin.systemd:
        scope: user
        name: logging-dozzle.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      ignore_errors: "{{ ansible_check_mode }}"

    # ------------------------------------------------------------------
    # Immediate deploy (only with an explicit --tags) -- pulls the image
    # tag the Quadlet uses (osa_*_image_tag, default "latest") and restarts
    # the affected pod when the running container does not use that image
    # yet, instead of waiting for the nightly podman-auto-update.timer.
    # "-e force_restart=true" restarts the pod regardless.
    # ------------------------------------------------------------------
    - name: Immediate deploy of osa-backend
      tags: [never, deploy-backend]
      ansible.builtin.include_tasks:
        file: tasks/immediate_deploy.yml
        apply:
          tags: [deploy-backend]
      vars:
        deploy_image: "{{ registry_prefix }}/osa-backend:{{ osa_backend_image_tag | default('latest') }}"
        deploy_container: osa-backend
        deploy_pod_unit: osa-backend-pod.service

    - name: Immediate deploy of osa-frontend
      tags: [never, deploy-frontend]
      ansible.builtin.include_tasks:
        file: tasks/immediate_deploy.yml
        apply:
          tags: [deploy-frontend]
      vars:
        deploy_image: "{{ registry_prefix }}/osa-frontend:{{ osa_frontend_image_tag | default('latest') }}"
        deploy_container: osa-frontend
        deploy_pod_unit: osa-frontend-pod.service
