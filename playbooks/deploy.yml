---
# Tag-2-Betrieb: Secrets, Quadlet-Definitionen, die Caddyfile und Timer auf
# dem Produktions-Host synchron halten, und den kompletten Stack (Caddy +
# Backend + Frontend + Dozzle) plus den woechentlichen podman-prune-Timer
# am Laufen halten. Baut KEINE Images, klont KEINE App-Repos -- die Images
# kommen bereits fertig gebaut aus ghcr.io und werden vom bereits aktiven
# podman-auto-update.timer automatisch eingespielt.
#
# Aufruf: ansible-playbook -i inventory/<stage>.ini playbooks/deploy.yml --ask-vault-pass --check --diff
#         ansible-playbook -i inventory/<stage>.ini playbooks/deploy.yml --ask-vault-pass
# <stage> ist eine der Dateien in inventory/ (production/test/qa).
#
# Sofort-Deploy statt auf den naechtlichen Auto-Update-Lauf zu warten:
#   ansible-playbook -i inventory/<stage>.ini ... --ask-vault-pass --tags deploy-backend
#   ansible-playbook -i inventory/<stage>.ini ... --ask-vault-pass --tags deploy-frontend

- name: Deploy/Sync auf dem P-System (einteilung.hochamt.at)
  hosts: vps
  remote_user: service
  gather_facts: yes
  # Explicit vars_files instead of inventory/group_vars/: an
  # automatically-loaded group variable applies to EVERY play that
  # targets this host -- including setup_vps.yml (hosts: all), which
  # never references koofr_user/koofr_password at all. vars_files scopes
  # the file to this one play instead, so only a deploy.yml run needs a
  # vault password for it.
  vars_files:
    - ../secrets/shared/koofr.yml
  vars:
    local_secrets_path: "../secrets/{{ app_environment }}"
    local_quadlets_path: "../quadlets"
    local_templates_path: "../templates"
    local_timers_path: "../systemd-timers"
    local_caddyfile_path: "../config/caddy/Caddyfile.j2"

    remote_env_dir: "{{ ansible_user_dir }}/.env"
    remote_quadlet_base: "{{ ansible_user_dir }}/.config/containers/systemd"
    remote_systemd_user_dir: "{{ ansible_user_dir }}/.config/systemd/user"
    xdg_runtime_dir: "/run/user/{{ ansible_facts.user_uid }}"

    # Quadlet-Quellordner -> Zielpfad unter remote_quadlet_base.
    quadlet_targets:
      - { src: caddy, dest: "osa/infrastructure/caddy" }
      - { src: logging, dest: "osa/infrastructure/logging" }
      - { src: backend, dest: "osa/osa-backend" }
      - { src: worker, dest: "osa/osa-backend" }
      - { src: frontend, dest: "osa/osa-frontend" }

    # Der komplette Stack -- ein einziger Satz Units.
    managed_units_safe:
      - podman-prune.timer
      - caddy.service
      - osa-backend-pod.service
      - osa-frontend-pod.service
      - logging-dozzle.service

  tasks:
    # "development" ist absichtlich NICHT in dieser Liste: lokale
    # Entwicklung laeuft ueber den Vite-Dev-Server direkt auf der
    # Dev-Maschine, nie ueber diesen Ansible-Flow -- auch wenn es einer der
    # vier gueltigen APP_ENVIRONMENT-Werte im Backend selbst ist (siehe
    # osa-backend/app/core/config.py's _VALID_ENVIRONMENTS).
    - name: app_environment gegen die gueltigen Ansible-Deploy-Stages pruefen
      tags: [always]
      ansible.builtin.assert:
        that:
          - "app_environment in ['test', 'qa', 'production']"
        fail_msg: >-
          app_environment='{{ app_environment }}' ist ungueltig. Muss eines
          von test/qa/production sein ("development" wird nie ueber
          osa-deploy ausgerollt).

    - name: Verzeichnisstruktur anlegen
      tags: [always]
      loop:
        - "{{ remote_env_dir }}"
        - "{{ remote_quadlet_base }}"
        - "{{ remote_systemd_user_dir }}"
        - "{{ ansible_user_dir }}/data/osa/{{ app_environment }}/postgres"
        - "{{ ansible_user_dir }}/data/osa/{{ app_environment }}/valkey"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"

    # Rootless-Podman UID mapping: a freshly created directory belongs to
    # the calling user's own UID in the default namespace, but the
    # official postgres image's entrypoint runs as UID 999 inside its own
    # namespace - without this fix, initdb fails on the very first start
    # with a permission error. Both commands must run under
    # "podman unshare", not a plain chown/chmod - afterwards the directory
    # belongs to the mapped UID, and the calling user itself can no longer
    # read it directly from outside a "podman unshare" shell. A no-op on
    # already-initialized directories (chown/chmod are idempotent).
    - name: PostgreSQL-Datenverzeichnis-Ownership sicherstellen (Rootless-Mapping)
      tags: [always]
      ansible.builtin.command: >-
        podman unshare chown -R 999:999
        {{ ansible_user_dir }}/data/osa/{{ app_environment }}/postgres
      changed_when: false

    - name: PostgreSQL-Datenverzeichnis-Berechtigungen sicherstellen
      tags: [always]
      ansible.builtin.command: >-
        podman unshare chmod 700
        {{ ansible_user_dir }}/data/osa/{{ app_environment }}/postgres
      changed_when: false

    - name: "*.env aus secrets/{{ app_environment }}/ finden (statisch)"
      tags: [always]
      delegate_to: localhost
      become: no
      ansible.builtin.find:
        paths: "{{ local_secrets_path }}"
        patterns: "*.env"
      register: secret_files

    - name: Statische Secrets nach ~/.env kopieren
      tags: [always]
      no_log: true
      loop: "{{ secret_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ remote_env_dir }}/{{ item.path | basename }}"
        mode: "0600"

    - name: "*.env.j2 aus secrets/{{ app_environment }}/ finden (templated)"
      tags: [always]
      delegate_to: localhost
      become: no
      ansible.builtin.find:
        paths: "{{ local_secrets_path }}"
        patterns: "*.env.j2"
      register: secret_templates

    - name: Templated Secrets rendern + nach ~/.env kopieren
      tags: [always]
      no_log: true
      loop: "{{ secret_templates.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      ansible.builtin.template:
        src: "{{ item.path }}"
        dest: "{{ remote_env_dir }}/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        mode: "0600"

    - name: Quadlet-Verzeichnisse anlegen
      tags: [always]
      loop: "{{ quadlet_targets }}"
      loop_control:
        label: "{{ item.dest }}"
      ansible.builtin.file:
        path: "{{ remote_quadlet_base }}/{{ item.dest }}"
        state: directory
        mode: "0755"

    # Caddy is excluded from this list (its own task right below, with its
    # own register) -- the restart trigger further down must also react to
    # changes in the quadlet definition itself, not only to changes in the
    # Caddyfile.
    - name: Quadlet-Dateien kopieren
      tags: [always]
      loop: "{{ quadlet_targets | rejectattr('src', 'equalto', 'caddy') | list }}"
      loop_control:
        label: "{{ item.dest }}"
      ansible.builtin.copy:
        src: "{{ local_quadlets_path }}/{{ item.src }}/"
        dest: "{{ remote_quadlet_base }}/{{ item.dest }}/"
        mode: "0644"
      register: quadlet_copy_results

    # Kept separate from the generic copy above so a change to the quadlet
    # definition itself (e.g. its volume mount) triggers the same Caddy
    # restart as a change to the Caddyfile.
    - name: Caddy-Quadlet-Dateien kopieren
      tags: [always]
      ansible.builtin.copy:
        src: "{{ local_quadlets_path }}/caddy/"
        dest: "{{ remote_quadlet_base }}/osa/infrastructure/caddy/"
        mode: "0644"
      register: caddy_quadlet_copy

    # Beide Quadlets mit stage-abhaengigem Inhalt (Datenpfad) -- separat
    # von der generischen Verzeichnis-Kopie oben, da sie gerendert statt
    # nur kopiert werden muessen.
    - name: "PostgreSQL-Quadlet rendern (Volume-Pfad ist stage-abhaengig)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/osa-backend-pg.container.j2"
        dest: "{{ remote_quadlet_base }}/osa/osa-backend/osa-backend-pg.container"
        mode: "0644"
      register: pg_quadlet_render

    - name: "Valkey-Quadlet rendern (Volume-Pfad ist stage-abhaengig)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/osa-backend-valkey.container.j2"
        dest: "{{ remote_quadlet_base }}/osa/osa-backend/osa-backend-valkey.container"
        mode: "0644"
      register: valkey_quadlet_render

    # caddy.container's Volume-Mount erwartet die Caddyfile direkt neben
    # der Quadlet-Definition, siehe quadlets/caddy/caddy.container.
    - name: Caddyfile rendern
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_caddyfile_path }}"
        dest: "{{ remote_quadlet_base }}/osa/infrastructure/caddy/Caddyfile"
        mode: "0644"
      register: caddyfile_copy

    # Beide Volume-Quadlets tragen den Stage-Namen im VolumeName= (statt
    # eines hartcodierten "-prod"), deshalb gerendert statt nur kopiert --
    # dieselbe Datei landet sonst identisch auf test/qa und benennt deren
    # Volumes faelschlich "prod".
    - name: "Caddy-Data-Volume-Quadlet rendern (Volume-Name ist stage-abhaengig)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/caddy-data.volume.j2"
        dest: "{{ remote_quadlet_base }}/osa/infrastructure/caddy/caddy-data.volume"
        mode: "0644"
      register: caddy_data_volume_render

    - name: "Caddy-Config-Volume-Quadlet rendern (Volume-Name ist stage-abhaengig)"
      tags: [always]
      ansible.builtin.template:
        src: "{{ local_templates_path }}/caddy-config.volume.j2"
        dest: "{{ remote_quadlet_base }}/osa/infrastructure/caddy/caddy-config.volume"
        mode: "0644"
      register: caddy_config_volume_render

    - name: Native systemd-Units kopieren (podman-prune Service + Timer, kein Quadlet, eigener Zielpfad)
      tags: [always]
      ansible.builtin.copy:
        src: "{{ local_timers_path }}/"
        dest: "{{ remote_systemd_user_dir }}/"
        mode: "0644"

    - name: systemctl --user daemon-reload
      tags: [always]
      ansible.builtin.systemd:
        scope: user
        daemon_reload: yes
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: Stack-Dienste + Timer aktivieren + starten
      tags: [always]
      loop: "{{ managed_units_safe }}"
      ansible.builtin.systemd:
        scope: user
        name: "{{ item }}"
        enabled: yes
        state: started
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      # A stage's very first deploy: --check never actually writes the
      # Quadlet files above, so systemd-generator never produces these
      # units at all yet -- querying their current state genuinely fails,
      # not just "would change". ignore_errors here only ever applies
      # under --check (a real apply still fails hard on a real problem);
      # on an already-deployed host the units exist and this task
      # succeeds normally, so this never hides a real diff there.
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Caddy neu starten, falls sich die Caddyfile oder das Quadlet geändert hat
      tags: [always]
      when: >-
        caddyfile_copy.changed or caddy_quadlet_copy.changed
        or caddy_data_volume_render.changed or caddy_config_volume_render.changed
      ansible.builtin.systemd:
        scope: user
        name: caddy.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      # Same first-deploy reasoning as the task above -- caddy.service
      # doesn't exist yet either on a --check run against a brand-new host.
      ignore_errors: "{{ ansible_check_mode }}"

    # osa-backend-pod covers backend+worker: both quadlet_targets entries
    # copy into the same "osa/osa-backend" destination directory, and both
    # containers are members of the same pod (osa-backend.pod's own
    # Wants=/Before= already restarts the worker alongside it, see that
    # file). Without this task, a quadlet-only change (e.g. a hardening
    # flag) would sit on disk without ever reaching the running container.
    - name: osa-backend-pod neu starten, falls Backend-/Worker-/PG-/Valkey-Quadlet sich geaendert hat
      tags: [always]
      when: >-
        (quadlet_copy_results.results
          | selectattr('item.dest', 'equalto', 'osa/osa-backend')
          | selectattr('changed')
          | list | length > 0)
        or pg_quadlet_render.changed
        or valkey_quadlet_render.changed
      ansible.builtin.systemd:
        scope: user
        name: osa-backend-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      ignore_errors: "{{ ansible_check_mode }}"

    - name: osa-frontend-pod neu starten, falls das Frontend-Quadlet sich geaendert hat
      tags: [always]
      when: >-
        quadlet_copy_results.results
          | selectattr('item.dest', 'equalto', 'osa/osa-frontend')
          | selectattr('changed')
          | list | length > 0
      ansible.builtin.systemd:
        scope: user
        name: osa-frontend-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      ignore_errors: "{{ ansible_check_mode }}"

    - name: logging-dozzle neu starten, falls dessen Quadlet sich geaendert hat
      tags: [always]
      when: >-
        quadlet_copy_results.results
          | selectattr('item.dest', 'equalto', 'osa/infrastructure/logging')
          | selectattr('changed')
          | list | length > 0
      ansible.builtin.systemd:
        scope: user
        name: logging-dozzle.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      ignore_errors: "{{ ansible_check_mode }}"

    # ------------------------------------------------------------------
    # Sofort-Deploy (nur bei explizitem --tags) -- pullt das aktuelle
    # :latest-Image und startet den betroffenen Pod neu, statt auf den
    # naechtlichen podman-auto-update.timer zu warten.
    # ------------------------------------------------------------------
    # podman pull writes its progress (including "Copying blob") to stderr,
    # on every single call, regardless of whether the image actually
    # changed. Only the final image ID on stdout is reliable -- the same
    # value "podman image inspect --format '{{.Id}}'" would report.
    - name: "Sofort-Deploy osa-backend: aktuelle lokale Image-ID ermitteln"
      tags: [never, deploy-backend]
      ansible.builtin.command: >-
        podman image inspect ghcr.io/kirchenmusik-st-augustin/osa-backend:latest
        --format '{{ "{{" }}.Id{{ "}}" }}'
      register: osa_backend_image_id_before
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false
      failed_when: false

    - name: "Sofort-Deploy osa-backend: Image pullen"
      tags: [never, deploy-backend]
      ansible.builtin.command: podman pull ghcr.io/kirchenmusik-st-augustin/osa-backend:latest
      register: osa_backend_pull_result
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: osa_backend_image_id_before.stdout != osa_backend_pull_result.stdout_lines[-1]

    - name: "Sofort-Deploy osa-backend: Pod neu starten"
      # NICHT osa-backend.service direkt neu starten: der Container ist
      # per generiertem BindsTo= an osa-backend-pod.service gebunden --
      # ein Container-Restart stoppt dabei den ganzen Pod, aber nichts
      # startet ihn danach von selbst wieder (empirisch verifiziert). Der
      # Pod-Service selbst zieht den enthaltenen Container ueber
      # Wants=/Before= korrekt wieder hoch.
      tags: [never, deploy-backend]
      ansible.builtin.systemd:
        scope: user
        name: osa-backend-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"

    - name: "Sofort-Deploy osa-frontend: aktuelle lokale Image-ID ermitteln"
      tags: [never, deploy-frontend]
      ansible.builtin.command: >-
        podman image inspect ghcr.io/kirchenmusik-st-augustin/osa-frontend:latest
        --format '{{ "{{" }}.Id{{ "}}" }}'
      register: osa_frontend_image_id_before
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: false
      failed_when: false

    - name: "Sofort-Deploy osa-frontend: Image pullen"
      tags: [never, deploy-frontend]
      ansible.builtin.command: podman pull ghcr.io/kirchenmusik-st-augustin/osa-frontend:latest
      register: osa_frontend_pull_result
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      changed_when: osa_frontend_image_id_before.stdout != osa_frontend_pull_result.stdout_lines[-1]

    - name: "Sofort-Deploy osa-frontend: Pod neu starten"
      tags: [never, deploy-frontend]
      ansible.builtin.systemd:
        scope: user
        name: osa-frontend-pod.service
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
