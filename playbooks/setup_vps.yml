---
# Base configuration for a new VPS: bare system -> hardened,
# rootless-Podman-capable system with the "admin" and "service" users.
#
# First run: ansible-playbook -i inventory/<stage>.ini playbooks/setup_vps.yml -u root
# Re-runs:   ansible-playbook -i inventory/<stage>.ini playbooks/setup_vps.yml -u admin --ask-become-pass
#            (root SSH login gets disabled at the end of this playbook)
#
# This playbook is the bus-factor safety net in case the production system
# ever needs a full reinstall. The live host is already bootstrapped - a
# re-run only serves as verification (--check --diff should report "no
# change"), not routine operation.

- name: Base configuration for a new VPS
  hosts: all
  become: yes
  vars:
    local_ssh_pub_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
    # Minimum Podman major version this playbook requires, regardless of
    # os_family/distribution - checked once, uniformly, right after the
    # native package install (see task 2 below). Deliberately no
    # third-party-repo fallback for distros whose own repos ship an older
    # Podman: that would mean depending on a single-maintainer OBS
    # project's long-term availability and an extra, unofficial signing
    # key trusted on every host, just to keep provisioning brand-new
    # hosts on an already aging release branch. Failing loudly here and
    # pointing at a current release is the right call for a "fresh OS
    # install" runbook.
    minimum_podman_major_version: 5

  tasks:
    # ------------------------------------------------------------------
    # 1. Full upgrade + core packages, Podman from each distro's own
    #    native repo (step 2 checks whether the version is sufficient).
    #    "passt" (provides the "pasta" binary) instead of "slirp4netns":
    #    since Podman 5, pasta is the rootless-networking default
    #    (containers.conf: default_rootless_network_cmd=pasta), both for
    #    an explicit "Network=pasta:..." (osa-backend.pod) and for pods
    #    without their own Network= line (osa-frontend.pod uses the
    #    default). slirp4netns is never used anywhere in this stack and
    #    is therefore no longer installed.
    # ------------------------------------------------------------------
    - name: Full upgrade + install core packages (Debian)
      when: ansible_os_family == "Debian"
      block:
        - ansible.builtin.apt:
            update_cache: yes
            upgrade: dist
        - ansible.builtin.apt:
            name:
              - git
              - podman
              - netavark
              - aardvark-dns
              - ufw
              - sudo
              - uidmap
              - dbus-user-session
              - passt
              # Only a Recommends of the podman package, not a hard Depends -
              # silently missing on any image with APT::Install-Recommends
              # disabled (common on minimal cloud images), which then makes
              # every "podman pod create" fail ("finding pause binary: exec:
              # \"catatonit\": executable file not found in $PATH").
              - catatonit
              - curl
              - tar
            state: present

    - name: Full upgrade + install core packages (RedHat)
      when: ansible_os_family == "RedHat"
      block:
        - ansible.builtin.dnf:
            name: "*"
            state: latest
        - ansible.builtin.dnf:
            name:
              - git
              - podman
              - netavark
              - aardvark-dns
              - firewalld
              - sudo
              - shadow-utils
              - passt
              - curl
              - tar
            state: present

    - name: Full upgrade + install core packages (SUSE)
      when: ansible_os_family == "Suse"
      block:
        - community.general.zypper:
            name: "*"
            state: latest
        - community.general.zypper:
            name:
              - git
              - podman
              - netavark
              - aardvark-dns
              - firewalld
              - sudo
              - shadow
              - passt
              - curl
              - tar
            state: present

    # ------------------------------------------------------------------
    # 2. Check the Podman version - fail fast instead of a third-party
    #    fallback. Current default images (verified 2026-08-27: Debian
    #    13, Ubuntu 26.04 LTS, Rocky/Alma/CentOS Stream 10, Fedora,
    #    openSUSE Leap 16.0) already ship Podman >=5 natively. Running
    #    this playbook against an older release branch (Debian 12, Ubuntu
    #    24.04 LTS, RHEL-family 9.x - confirmed still on Podman 4.x;
    #    openSUSE Leap 15.x - likely too, exact current version
    #    unconfirmed) gets a clear abort instead of a silent third-party
    #    fix - see the rationale at minimum_podman_major_version above.
    # ------------------------------------------------------------------
    - name: Determine installed Podman version
      # command/shell tasks are skipped (not actually run) under --check by
      # default - without check_mode: false, podman_version_check.stdout
      # would stay unset here, and the next task's ".split()[-1]" on it
      # crashes with a hard error instead of the intended assert-driven
      # failure message. Read-only (changed_when: false already marks it as
      # never "changed"), so forcing real execution during --check has no
      # side effect - exactly what a re-run's "expect near-zero diff"
      # verification needs.
      ansible.builtin.command: podman --version
      register: podman_version_check
      changed_when: false
      check_mode: false

    - name: Extract Podman major version
      ansible.builtin.set_fact:
        podman_major_version: "{{ podman_version_check.stdout.split()[-1].split('.')[0] | int }}"

    - name: Ensure minimum Podman version
      ansible.builtin.assert:
        that:
          - podman_major_version | int >= minimum_podman_major_version | int
        fail_msg: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          only ships {{ podman_version_check.stdout }} natively (required:
          major version >={{ minimum_podman_major_version }}). This
          release branch is too old for this playbook - reinstall a
          current release branch of the same distribution (see README:
          Supported Distributions) instead of continuing to run this host.
        success_msg: >-
          Native {{ podman_version_check.stdout }} meets the minimum
          requirement (major version >={{ minimum_podman_major_version }}).

    # ------------------------------------------------------------------
    # 3. User management: "admin" (sudo) + "service" (rootless Podman)
    # ------------------------------------------------------------------
    - name: Check whether "admin" already exists
      ansible.builtin.command: id admin
      register: admin_check
      changed_when: false
      failed_when: false

    - name: Check whether "service" already exists
      ansible.builtin.command: id service
      register: service_check
      changed_when: false
      failed_when: false

    - name: Generate random passwords
      ansible.builtin.set_fact:
        admin_pw: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"
        service_pw: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

    - name: Create user "admin"
      ansible.builtin.user:
        name: admin
        groups: "{{ 'sudo' if ansible_os_family == 'Debian' else 'wheel' }}"
        append: yes
        shell: /bin/bash
        state: present

    - name: Create user "service"
      ansible.builtin.user:
        name: service
        shell: /bin/bash
        state: present

    - name: Check whether the "systemd-journal" group exists
      ansible.builtin.command: getent group systemd-journal
      register: journal_group_check
      changed_when: false
      failed_when: false

    - name: Add user "service" to systemd-journal
      when: journal_group_check.rc == 0
      ansible.builtin.user:
        name: service
        groups: systemd-journal
        append: yes

    - name: Set password for "admin" (only on first creation)
      when: admin_check.rc != 0
      ansible.builtin.user:
        name: admin
        password: "{{ admin_pw | password_hash('sha512') }}"

    - name: Set password for "service" (only on first creation)
      when: service_check.rc != 0
      ansible.builtin.user:
        name: service
        password: "{{ service_pw | password_hash('sha512') }}"

    # ------------------------------------------------------------------
    # 4. Persistent systemd journal
    # ------------------------------------------------------------------
    - name: Create /var/log/journal (if the systemd-journal group exists)
      when: journal_group_check.rc == 0
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"

    - name: Switch journald to persistent storage
      # Some minimal systemd packages (e.g. some cloud-image variants of
      # the RHEL family) don't ship /etc/systemd/journald.conf at all -
      # systemd then falls back to its compiled-in defaults. lineinfile
      # fails on a missing destination file without "create: yes"; with
      # create: yes it creates a minimal one when needed, without
      # treating existing installations (which already have the file)
      # any differently.
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: "^#?Storage="
        line: "Storage=persistent"
        create: yes
      notify: restart journald

    # ------------------------------------------------------------------
    # 5. SSH key distribution
    # ------------------------------------------------------------------
    - name: Create ~/.ssh for admin/service
      loop: [admin, service]
      ansible.builtin.file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0700"

    - name: Add local public key to authorized_keys
      loop: [admin, service]
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ local_ssh_pub_key }}"
        state: present

    # ------------------------------------------------------------------
    # 6. Rootless Podman: linger + kernel tuning
    # ------------------------------------------------------------------
    - name: Enable linger for "service" (containers survive logout)
      ansible.builtin.command: loginctl enable-linger service
      changed_when: true

    - name: Allow unprivileged ports from 25 (for rootless Podman)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-podman-ports.conf
        content: "net.ipv4.ip_unprivileged_port_start=25\n"
        mode: "0644"
      notify: reload sysctl

    - name: Create ~/.config/containers for "service"
      ansible.builtin.file:
        path: /home/service/.config/containers
        state: directory
        owner: service
        group: service
        mode: "0755"

    - name: Write rootless storage override for "service"
      # Originally needed because a third-party repo used earlier shipped
      # a /usr/share/containers/storage.conf that unconditionally set
      # "runroot" to the root-only path "/run/containers/storage" - that
      # overrode Podman's own rootless auto-detection and made every
      # container start fail with "permission denied". That repo is no
      # longer added (see task 2 above) and the native Podman packages of
      # the supported distributions aren't affected by this - the
      # override still stays in place as a cheap, harmless safeguard in
      # case a package with a similarly hardcoded storage.conf ever shows
      # up. Fix: our own minimal storage.conf for "service" WITHOUT a
      # runroot/graphroot line - then Podman's correct rootless default
      # kicks back in ("$XDG_RUNTIME_DIR/containers" or
      # "~/.local/share/containers/storage").
      ansible.builtin.copy:
        dest: /home/service/.config/containers/storage.conf
        content: |
          [storage]
          driver = "overlay"
        owner: service
        group: service
        mode: "0644"

    # ------------------------------------------------------------------
    # 7. Reboot NOW (finalizes kernel/Podman/sysctl changes) -
    # deliberately BEFORE the SSH hardening: the reboot module reconnects
    # as root after the restart to verify the host is back up. If
    # PermitRootLogin=no had already been written to disk beforehand, the
    # freshly started sshd would lock root out immediately and the
    # module would hang until reboot_timeout on its own reconnect check.
    # ------------------------------------------------------------------
    - name: Reboot host (finalizes kernel/Podman/systemd changes)
      ansible.builtin.reboot:
        reboot_timeout: 600

    # ------------------------------------------------------------------
    # 8. Firewall: only SSH + HTTP/HTTPS (Caddy) left open
    # ------------------------------------------------------------------
    - name: Configure firewall (Debian/UFW)
      when: ansible_os_family == "Debian"
      block:
        - ansible.builtin.command: ufw default allow outgoing
        - ansible.builtin.command: ufw default deny incoming
        - ansible.builtin.command: ufw allow 22/tcp
        - ansible.builtin.command: ufw allow 80/tcp
        - ansible.builtin.command: ufw allow 443/tcp
        - ansible.builtin.command: ufw --force enable

    - name: Configure firewall (RedHat/SUSE/firewalld)
      when: ansible_os_family in ["RedHat", "Suse"]
      block:
        - ansible.builtin.systemd:
            name: firewalld
            state: started
            enabled: yes
        - ansible.builtin.command: firewall-cmd --set-default-zone=public
        - ansible.builtin.firewalld:
            port: "{{ item }}"
            permanent: yes
            state: enabled
          loop:
            - 22/tcp
            - 80/tcp
            - 443/tcp
        - ansible.builtin.command: firewall-cmd --reload

    # ------------------------------------------------------------------
    # 9. SSH hardening (after the reboot - locks root out only at the end
    # of the play via the handler, no more root connection needed from
    # here)
    # ------------------------------------------------------------------
    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
      notify: restart sshd

    - name: Disable password login for "admin" (key-only)
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE MANAGED BLOCK - admin key-only"
        block: |
          Match User admin
              PasswordAuthentication no
      notify: restart sshd

    # ------------------------------------------------------------------
    # 10. Wrap-up: password notice
    # ------------------------------------------------------------------
    - name: Show generated admin password (only on first creation!)
      when: admin_check.rc != 0
      ansible.builtin.debug:
        msg: "IMPORTANT - save this in the password safe right now: admin / {{ admin_pw }}"

  handlers:
    - name: reload sysctl
      ansible.builtin.command: sysctl --system
      listen: reload sysctl

    - name: restart sshd
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted
      listen: restart sshd

    - name: restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      listen: restart journald
