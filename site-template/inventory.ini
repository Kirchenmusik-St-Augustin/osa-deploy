# Inventory of one stage. `./osa init <stage>` copies this skeleton to
# sites/<stage>/ and fills in app_environment. Replace every placeholder
# before the first run; deploy.yml refuses placeholder host names.
[vps]
CHANGEME.example.invalid

[vps:vars]
app_environment=__STAGE__
# Backend and frontend share one domain (path-based split under /api) on
# production. Use two different names for a split-domain stage.
backend_domain=CHANGEME.example.invalid
frontend_domain=CHANGEME.example.invalid
shorturl_domain=CHANGEME.example.invalid
# The log viewer (Dozzle) on a name of its own, behind the basic auth of
# secrets/caddy.env.
logging_domain=CHANGEME.example.invalid
acme_email=CHANGEME@example.invalid

# Optional: pin the application images of this stage to a release. Without
# these lines the stage follows the tag "latest".
# osa_backend_image_tag=<full image tag>
# osa_frontend_image_tag=<full image tag>
# Optional: restrict the log viewer path to these client networks.
# logging_allowed_cidrs=["203.0.113.0/24"]
# Optional: serve the static website of the Augustinian church on this stage
# (Caddy, mirrored every five minutes by augustiner-pull.timer). The aliases
# redirect permanently to augustiner_domain, path kept; each redirect name
# leads permanently (301) to one fixed page of it, optionally with an
# #anchor. Add a name only after its DNS record points at this host. The site
# needs the repository's read-only deploy key in secrets/augustiner-pull.key
# (vault-encrypted, see the README, appendix "Secrets").
# augustiner_noindex (default true) keeps search engines away while an
# interim domain is in use.
# augustiner_domain=www.example.org
# augustiner_alias_domains=["example.org", "www.example.net"]
# augustiner_redirects={"example.com": "/pages/a.html", "www.example.com": "/pages/a.html", "example.net": "/pages/a.html#part"}
# augustiner_noindex=false
# Optional, needs augustiner_domain: hourly visitor statistics of the static
# website on a name of its own, behind the login of the log viewer
# (secrets/caddy.env). Add it only after its DNS record points at this host.
# augustiner_stats_domain=stats.example.org
