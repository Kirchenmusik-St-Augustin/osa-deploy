# Inventory of one stage. `./osa init <stage>` copies this skeleton to
# sites/<stage>/ and fills in app_environment. Replace every placeholder
# before the first run; deploy.yml refuses placeholder host names.
[vps]
CHANGEME.example.invalid

[vps:vars]
app_environment=__STAGE__
# Backend and frontend share one domain (path-based split under /api) on
# production. Use two different names for a split-domain stage.
backend_domain=CHANGEME.example.invalid
frontend_domain=CHANGEME.example.invalid
shorturl_domain=CHANGEME.example.invalid
acme_email=CHANGEME@example.invalid

# Optional: pin the application images of this stage to a release. Without
# these lines the stage follows the tag "latest".
# osa_backend_image_tag=<full image tag>
# osa_frontend_image_tag=<full image tag>
# Optional: restrict the log viewer path to these client networks.
# logging_allowed_cidrs=["203.0.113.0/24"]
