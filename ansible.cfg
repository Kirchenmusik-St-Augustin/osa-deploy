[defaults]
# No default inventory on purpose: every run goes through ./osa, which names
# the inventory of one stage explicitly, so a forgotten flag fails loudly
# instead of silently targeting the wrong stage.
#
# host_key_checking is deliberately left at Ansible's default (True): this
# tool has full root-equivalent deploy access to production, and disabling
# host-key verification removes MITM protection on both first contact and
# any later, unnoticed host-key change. Before the first run against a new
# host, connect once manually (e.g. `ssh service@<host>`) and verify the
# fingerprint over an independent channel so it lands in ~/.ssh/known_hosts
# under normal SSH trust. StrictHostKeyChecking=yes is pinned in ssh_args
# below because ssh_args replaces Ansible's default arguments: without it a
# user-level ~/.ssh/config with `StrictHostKeyChecking no` or `accept-new`
# would silently weaken this check. IdentitiesOnly=yes makes ssh offer only
# the operator key that ./osa passes with --private-key, never every key of a
# running agent.
interpreter_python = auto_silent
stdout_callback = yaml
# Prints per-task timing at the end of each run -- useful for spotting a
# hanging/slow task on the prod host without extra -v flags.
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
