[defaults]
# No default inventory on purpose: every run must name a stage explicitly
# via -i inventory/<stage>.ini, so a forgotten flag fails loudly instead of
# silently targeting the wrong stage.
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = yaml
# Prints per-task timing at the end of each run -- useful for spotting a
# hanging/slow task on the prod host without extra -v flags.
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
