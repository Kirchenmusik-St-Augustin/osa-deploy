repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^(templates|quadlets)/
      - id: check-merge-conflict
      - id: detect-private-key
        # One test asserts the PEM header of a freshly generated key; it holds no key.
        exclude: ^tests/test_commands\.py$
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-vault-files-in-this-repository
        name: Refuse vault-encrypted files (they belong in the site repository)
        language: pygrep
        entry: '^\$ANSIBLE_VAULT;'
        types: [text]
        exclude: ^tests/

      - id: ruff
        name: ruff check
        entry: uv run --no-project --with-requirements requirements-dev.lock ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-project --with-requirements requirements-dev.lock ruff format --check
        language: system
        types: [python]

      - id: pyright
        name: pyright strict
        entry: uv run --no-project --with-requirements requirements-dev.lock pyright
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest with coverage
        entry: uv run --no-project --with-requirements requirements-dev.lock pytest -q
        language: system
        pass_filenames: false
        always_run: true
